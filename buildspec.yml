version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17   # Use Amazon Corretto JDK 17 (adjust if needed)
    commands:
      - echo "Installing Maven..."
      - mvn -version

  pre_build:
    commands:
      - echo "Cleaning project..."
      - mvn clean

  build:
    commands:
      - echo "Building Spring Boot application..."
      - mvn package -DskipTests
      - echo "Build completed. Artifact generated in target/"
      - mkdir -p build-output
      - cp target/*.jar build-output/app.jar

artifacts:
  files:
    - build-output/app.jar
