version: 0.2

phases:
install:
runtime-versions:
java: corretto17
commands:
- echo Installing dependencies...
- mvn -version

build:
	commands:
		- echo Building the JAR file...
		- mvn clean install -DskipTests
		- echo Copying JAR to output folder...
		- mkdir -p build-output
		- cp target/*.jar build-output/app.jar
		
artifacts:
	files:
		- build-output/app.jar