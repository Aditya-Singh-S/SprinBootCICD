version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17   # Use Amazon Corretto JDK 17 (adjust if needed)
    commands:
      - echo "Installing Maven..."
      - yum install -y maven

  pre_build:
    commands:
      - echo "Cleaning project..."
      - mvn clean

  build:
    commands:
      - echo "Building Spring Boot application..."
      - mvn package -DskipTests
      - echo "Build completed. Artifact generated in target/"

  post_build:
    commands:
      - echo "Preparing application bundle for Elastic Beanstalk..."
      # Copy the JAR into a deployment directory
      - mkdir -p deploy
      - cp target/*.jar deploy/application.jar
      # Create a zip file for Elastic Beanstalk
      - cd deploy && zip -r ../springboot-app.zip .

artifacts:
  files:
    - springboot-app.zip
